<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS & JS Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PREFRENCE SELECTOR</h1>
        
        <div class="preferences">
            <label for="color">Choose a color:</label>
            <select id="color">
                <option value="#ff9999">Light Red</option>
                <option value="#99ff99">Light Green</option>
                <option value="#9999ff">Light Blue</option>
                <option value="#ffff99">Light Yellow</option>
                <option value="#ff99ff">Light Pink</option>
            </select>
            
            <button id="savePref">Save Preferences</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
